[package]
name = "tauri-plugin-napvault"
version = "0.1.0"
authors = [ "Nap Wallet" ]
description = "Face ID / fingerprint unlock for Nap Wallet: a secret in the Keychain or Android Keystore behind biometrics"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-napvault"

[dependencies]
tauri = { version = "2.11.6" }
serde = "1.0"
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

# Built with the app, not the repo workspace.
[workspace]
