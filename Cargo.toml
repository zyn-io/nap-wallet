[workspace]
members = ["zyn-vm", "zyn-bridge", "zyn-custody", "zyn-pool"]
# The WebAssembly cores (apps/nap-web/zec-core, pool-core) are workspaces of
# their own: they build for wasm32 only.
exclude = ["apps/nap-web/zec-core", "apps/nap-web/pool-core"]
resolver = "2"

# Silent wrapping in value arithmetic mints money.
[profile.release]
overflow-checks = true
